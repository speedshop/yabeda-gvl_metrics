name: Ruby

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  mri:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby_version:
          - '4.0'
          - '3.4'
          - '3.3'

    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true
      - run: bundle exec rake
